name: test_multi_star
limit: 15000
memory_size: 0x2000

memory_mapped_io:
  0x80: ["*", "f", "o", "o", "*", "\n", "1", "2", "3", "f", "o", "o", "b", "a", "r", "\n"]
  0x84: []

reports:
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1]