name: test_question_too_short
limit: 5000
memory_size: 0x2000

memory_mapped_io:
  0x80: ["h", "e", "l", "l", "o", "?", "\n", "h", "e", "l", "l", "o", "\n"]
  0x84: []

reports:
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [0]