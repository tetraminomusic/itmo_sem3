name: test_world
limit: 1000
memory_size: 0x1000

memory_mapped_io:
  0x80: ["W", "o", "r", "l", "d", "\n"]
  0x84: []

reports:
  - name: Trass
    slice: all
    view: |
      {pc}:	{instruction:next}	{pc:label}  
  - name: Result
    slice: last
    view: |
      symio[0x80]: {io:0x80:sym}
      numio[0x84]: {io:0x84:dec}
      {memory:0:31}
    assert: |
      symio[0x80]: "" >>> ""
      numio[0x84]: [] >>> [0]