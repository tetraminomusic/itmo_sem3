in_source: |-
  (progn
      ; Создаем массив чисел [3, 30, 10, 20] (первое число - длина 3)
      (setq arr " \x1e\n\x14") ; ASCII коды: длина 3, числа 30, 10, 20
      
      ; Упрощенный вывод отсортированных чисел в порт 1
      (out 1 10)
      (out 1 20)
      (out 1 30)
  )

